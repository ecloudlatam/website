<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="radialCyan" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialIndigo" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#radialCyan)"/>
  <rect width="1200" height="630" fill="url(#radialIndigo)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Logo Group -->
  <g transform="translate(100, 100)">
    <!-- Logo Badge Box -->
    <rect width="64" height="64" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <path d="M16 40a10 10 0 0 1 2.4-19.6A13 13 0 0 1 43.6 18 10 10 0 0 1 48 40H16z" fill="none" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="32" r="3" fill="#38bdf8"/>
    <circle cx="32" cy="24" r="3" fill="#818cf8"/>
    <circle cx="42" cy="32" r="3" fill="#c084fc"/>
    <line x1="22" y1="32" x2="32" y2="24" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="32" y1="24" x2="42" y2="32" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8"/>
    
    <!-- Brand Title -->
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Ecloudlab</text>
  </g>

  <!-- Status / Pill Badge -->
  <g transform="translate(100, 205)">
    <rect width="330" height="36" rx="18" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#10b981"/>
    <text x="34" y="23" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="0.5">AI INNOVATION &amp; EXPERIMENTAL LAB</text>
  </g>

  <!-- Big Hero Headline -->
  <text x="100" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
    Autonomous AI Agents &amp;
  </text>
  <text x="100" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1.5">
    Intelligent Systems
  </text>

  <!-- Tagline / Subtitle -->
  <text x="100" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#94a3b8">
    Researching, designing, and deploying production-grade autonomous software.
  </text>

  <!-- Footer Info Line -->
  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <text x="0" y="32" font-family="'JetBrains Mono', monospace, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">ecloudlab.com</text>
    
    <!-- Active Project Pill -->
    <text x="260" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Flagship: <tspan fill="#38bdf8" font-weight="600">Nexus Bank Agent (Live)</tspan></text>
    
    <!-- Founder Attribution -->
    <text x="820" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Founded by <tspan fill="#ffffff" font-weight="600">Brian Pomaquero</tspan></text>
  </g>
</svg>
